[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-relay"
version = "0.1.0"
description = "Relay-Mixer für Online-Back-to-Back von DJs mit absichtlicher Latenz (Scheibe 1: Kern + Offline-Simulation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sim = ["scipy>=1.11"]
dev = ["pytest>=8", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: länger laufende Tests (mehrere Sekunden bis Minuten)"]
